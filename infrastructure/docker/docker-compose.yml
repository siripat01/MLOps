services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zenml}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - zenml-network

  zenml:
    image: zenmldocker/zenml-server
    container_name: zenml_server
    ports:
      - "8080:8080"
    environment:
      ZENML_STORE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-local-dev-mysql}@mysql:3306/${MYSQL_DATABASE:-zenml}
      ZENML_DEFAULT_USER_NAME: ${ZENML_DEFAULT_USER_NAME:-admin}
      ZENML_DEFAULT_USER_PASSWORD: ${ZENML_DEFAULT_USER_PASSWORD:-local-dev-zenml}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zenml-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: mlflow_server
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - zenml-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio_server
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-dev-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - zenml-network

  minio-create-buckets:
    image: quay.io/minio/mc:latest
    container_name: minio_create_buckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-dev-minio}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/mlflow;
      mc mb --ignore-existing local/zenml;
      mc mb --ignore-existing local/ml-data;
      exit 0;
      "
    networks:
      - zenml-network

  forecast-api:
    profiles: ["serving"]
    image: ${BENTO_RUNTIME_IMAGE:-mlops-project/store-sales-forecast:latest}
    container_name: store_sales_forecast
    ports:
      - "${BENTO_PUBLISHED_PORT:-8000}:3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:3000/readyz')
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - zenml-network

volumes:
  mysql_data:
  mlflow_data:
  minio_data:

networks:
  zenml-network:
    driver: bridge
