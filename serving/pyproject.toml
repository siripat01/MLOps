[project]
name = "autogluon-server"
version = "1.0.0"
description = "Generic startup-loaded AutoGluon TimeSeries FastAPI server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "autogluon.timeseries==1.6.1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pandas>=2.0,<2.4",
  "pydantic>=2,<3",
  "torch>=2.8,<2.11",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
