name: Promote model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Immutable model version, for example v19"
        required: true
      model_uri:
        description: "Complete model artifact URI"
        required: true
      pointer_uri:
        description: "Production pointer URI"
        required: true
        default: "s3://ml-models/store-sales/production.json"

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - name: Validate artifact and update production pointer
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: ${{ secrets.S3_REGION || 'us-east-1' }}
          MODEL_SHA256: ${{ secrets.MODEL_SHA256 }}
        run: |
          uv run python scripts/promote_model.py promote \
            --version "${{ inputs.model_version }}" \
            --artifact-uri "${{ inputs.model_uri }}" \
            --pointer-uri "${{ inputs.pointer_uri }}" \
            ${MODEL_SHA256:+--archive-sha256 "$MODEL_SHA256"}
