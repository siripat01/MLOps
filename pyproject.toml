[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-project"
version = "0.1.0"
description = "MLOps project starter"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "autogluon.timeseries==1.6.1",
  "bentoml>=1.3.20,<2",
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "kagglehub>=0.4,<0.5",
  "mlflow>=2.1.1,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<2.4",
  "pandera>=0.20,<0.27",
  "polars>=1.0,<2",
  "pydantic>=2,<3",
  "python-rapidjson<1.15",
  "python-dotenv>=1,<2",
  "s3fs>2022.3.0,!=2025.3.1",
  "torch>=2.8,<2.11",
  "uvicorn[standard]>=0.30,<1",
  "zenml[server]==0.96.4",
]

[project.scripts]
run-data-pipeline = "pipelines.data.main:main"
run-deployment-pipeline = "pipelines.deployment.main:main"
run-training-pipeline = "pipelines.training.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mlops_project*", "pipelines*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
