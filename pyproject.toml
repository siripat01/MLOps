[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-project"
version = "0.1.0"
description = "MLOps project starter"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "autogluon.timeseries==1.6.1",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<2.4",
  "torch>=2.8,<2.11",
  "zenml[server]==0.96.4",
]

[project.scripts]
prepare-data = "mlops_project.data.prepare:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
